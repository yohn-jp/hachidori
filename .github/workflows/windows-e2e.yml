name: Windows E2E certification

# Full Windows appliance E2E certification and, only on PASS, the development
# release. It certifies one release-candidate executable per main commit and is
# deliberately not a pull_request workflow: pull requests keep the lightweight
# Go CI path (ci.yml) and the build/test-only release.yml.
#
# Topology:
#   candidate (built once)
#     -> shard x6 (parallel; each verifies and consumes that same artifact)
#       -> aggregate (fails closed)
#         -> release (push to main only; publishes the certified candidate bytes)
#
# Hosted-runner results are CI evidence. They are never a physical Windows
# PASS; see docs/windows-certification-checklist.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One certification per commit; a newer push must not cancel the certification
# of an earlier main commit.
concurrency:
  group: windows-e2e-${{ github.sha }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build Windows candidate
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.identity.outputs.sha256 }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
      file: ${{ steps.identity.outputs.file }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      # The release gate this workflow replaces ran the Windows unit tests
      # before building; keep that gate ahead of the candidate.
      - name: Run Go tests
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The only build of hachidori.exe in this workflow. The recipe is the one
      # the previous development release used (no cgo is linked).
      - name: Build the one candidate executable
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force -Path candidate | Out-Null
          go build -o candidate/hachidori.exe ./cmd/hachidori
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record candidate identity
        id: identity
        shell: pwsh
        run: |
          go run ./test/windows-e2e/cmd/e2e-candidate write -dir candidate -file hachidori.exe -commit $env:GITHUB_SHA | Tee-Object -Variable identity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $identity | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
      - name: Upload candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-candidate
          path: candidate/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  # One matrix entry per #242 proof boundary. Each runs the Go package
  # test/windows-e2e/<shard> in certification mode against the downloaded
  # candidate. A shard adds scenarios by adding tests to its package and listing
  # them in the package's required.json; it adds shard-specific setup, if any,
  # as steps guarded by `if: matrix.shard == '<name>'` below the marked line.
  shard:
    name: shard (${{ matrix.shard }})
    needs: candidate
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard:
          - bootstrap
          - runtime
          - recovery
          - single-instance
          - update
          - diagnostics
    env:
      HACHIDORI_WINDOWS_E2E: "1"
      HACHIDORI_E2E_CANDIDATE_DIR: ${{ github.workspace }}\candidate
      HACHIDORI_E2E_EVIDENCE_DIR: ${{ github.workspace }}\evidence
      HACHIDORI_E2E_SOURCE_SHA: ${{ github.sha }}
      HACHIDORI_E2E_CANDIDATE_SHA256: ${{ needs.candidate.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Download the shared candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-candidate
          path: candidate
      - name: Verify candidate identity
        shell: pwsh
        run: |
          if (-not $env:HACHIDORI_E2E_CANDIDATE_SHA256) { throw "candidate job reported no SHA-256" }
          go run ./test/windows-e2e/cmd/e2e-candidate verify -dir candidate -commit $env:GITHUB_SHA -sha256 $env:HACHIDORI_E2E_CANDIDATE_SHA256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Shard-specific setup steps go here.
      - name: Resolve the fixture Python
        if: ${{ matrix.shard == 'runtime' || matrix.shard == 'recovery' }}
        shell: pwsh
        run: |
          # The fixture runtime is a venv of a host Python (3.9 or newer) with tiny
          # torch/laya stubs; nothing is downloaded.
          $py = (Get-Command python -ErrorAction Stop).Source
          $ver = & $py -c "import sys; print('%d.%d' % sys.version_info[:2])"
          if ([version]$ver -lt [version]'3.9') { throw "Python $ver is older than 3.9" }
          "HACHIDORI_E2E_PYTHON=$py" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Run shard ${{ matrix.shard }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:HACHIDORI_E2E_EVIDENCE_DIR '${{ matrix.shard }}') | Out-Null
          $log = Join-Path $env:HACHIDORI_E2E_EVIDENCE_DIR '${{ matrix.shard }}\go-test.log'
          go test -count=1 -timeout 30m -v ./test/windows-e2e/${{ matrix.shard }}/... *> "$log.full"
          $code = $LASTEXITCODE
          Get-Content "$log.full" -Tail 2000 | Out-File -Encoding utf8 $log
          Remove-Item "$log.full"
          exit $code
      - name: Upload shard evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-e2e-evidence-${{ matrix.shard }}
          path: evidence/${{ matrix.shard }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  # Fail-closed certification. It runs after the candidate and every shard,
  # also when one of them failed or was cancelled, and exits non-zero unless the
  # candidate and shard jobs succeeded and every required shard produced a
  # passing result for exactly the candidate. certification.json is retained
  # for successful and failed runs.
  aggregate:
    name: Aggregate certification
    needs: [candidate, shard]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Download the candidate
        if: ${{ needs.candidate.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-candidate
          path: candidate
      - name: Download shard evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: windows-e2e-evidence-*
          path: evidence
      - name: Aggregate
        id: aggregate
        shell: bash
        env:
          CANDIDATE_SHA256: ${{ needs.candidate.outputs.sha256 }}
          JOB_RESULTS: candidate=${{ needs.candidate.result }},shard=${{ needs.shard.result }}
        run: |
          set +e
          go run ./test/windows-e2e/cmd/e2e-aggregate aggregate \
            -evidence evidence -tests test/windows-e2e -candidate candidate \
            -commit "$GITHUB_SHA" -sha256 "$CANDIDATE_SHA256" \
            -jobs "$JOB_RESULTS" -out certification
          code=$?
          if [ -f certification/certification.md ]; then
            cat certification/certification.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
      - name: Upload certification
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-e2e-certification
          path: certification/
          if-no-files-found: warn
          overwrite: true
          retention-days: 90

  # Development release. It runs only when the certification passed (the
  # default success() condition over its needs), only for a push to main and
  # never for workflow_dispatch. It publishes the certified candidate bytes
  # themselves - never a rebuild - and re-checks the published asset against
  # the certified SHA-256.
  release:
    name: Publish development release
    needs: [candidate, aggregate]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: windows-e2e-development-release
      cancel-in-progress: false
    env:
      ASSET: hachidori-windows-amd64.exe
      DEVELOPMENT_LINE: "0.3"
      CANDIDATE_SHA256: ${{ needs.candidate.outputs.sha256 }}
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Download the certified candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-candidate
          path: candidate
      - name: Download the certification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-e2e-certification
          path: certification
      - name: Verify the certification covers this candidate
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_SHA256"
          go run ./test/windows-e2e/cmd/e2e-candidate verify -dir candidate -commit "$RELEASE_SHA" -sha256 "$CANDIDATE_SHA256"
          go run ./test/windows-e2e/cmd/e2e-aggregate release-check \
            -certification certification/certification.json \
            -commit "$RELEASE_SHA" -sha256 "$CANDIDATE_SHA256" -file hachidori.exe
      - name: Stage the certified bytes
        run: |
          set -euo pipefail
          mkdir release
          cp candidate/hachidori.exe "release/$ASSET"
          actual="$(sha256sum -- "release/$ASSET" | awk '{print $1}')"
          test "$actual" = "$CANDIDATE_SHA256"
          printf '%s  %s\n' "$actual" "$ASSET" > "release/$ASSET.sha256"
      - name: Allocate dev tag and publish prerelease
        id: publish
        run: |
          set -euo pipefail
          if [[ ! "$DEVELOPMENT_LINE" =~ ^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]]; then
            echo "development-line must be MAJOR.MINOR without leading zeros" >&2
            exit 1
          fi
          line_major="${BASH_REMATCH[1]}"
          line_minor="${BASH_REMATCH[2]}"
          refs_file="$RUNNER_TEMP/development-release-line-tags"
          gh api --paginate "repos/$GH_REPOSITORY/git/matching-refs/tags/$line_major.$line_minor." --jq '.[].ref' > "$refs_file"
          # Only MAJOR.MINOR.PATCH-dev tags on the selected line advance the
          # allocator; legacy dev-N, stable, and malformed tags are ignored.
          # Any existing tag whose version core is MAJOR.MINOR.PATCH (stable,
          # dev, or other pre-release/build variants) occupies that patch, so
          # the candidate skips forward and never reuses or moves a tag.
          dev_pattern="^refs/tags/$line_major\.$line_minor\.(0|[1-9][0-9]{0,17})-dev$"
          occupied_pattern="^refs/tags/$line_major\.$line_minor\.([0-9]{1,18})([-+].*)?$"
          max_patch=0
          declare -A occupied=()
          while IFS= read -r ref; do
            if [[ "$ref" =~ $dev_pattern ]]; then
              patch=$((10#${BASH_REMATCH[1]}))
              if (( patch > max_patch )); then max_patch=$patch; fi
            fi
            if [[ "$ref" =~ $occupied_pattern ]]; then
              occupied[$((10#${BASH_REMATCH[1]}))]=1
            fi
          done < "$refs_file"
          next_patch=$((max_patch + 1))
          while [[ -n "${occupied[$next_patch]:-}" ]]; do next_patch=$((next_patch + 1)); done
          release_tag="$line_major.$line_minor.$next_patch-dev"
          if grep -qxF "refs/tags/$release_tag" "$refs_file"; then
            echo "refusing to reuse existing tag $release_tag" >&2
            exit 1
          fi
          gh release create "$release_tag" "release/$ASSET" "release/$ASSET.sha256" \
            --repo "$GH_REPOSITORY" --title "$release_tag" \
            --notes "Automated Windows amd64 development build from $RELEASE_SHA, certified by Windows E2E run $GITHUB_RUN_ID (executable sha256 $CANDIDATE_SHA256)." \
            --target "$RELEASE_SHA" --prerelease --latest=false
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Verify the published asset is the certified candidate
        env:
          RELEASE_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir published
          gh release download "$RELEASE_TAG" --repo "$GH_REPOSITORY" --pattern "$ASSET" --dir published
          actual="$(sha256sum -- "published/$ASSET" | awk '{print $1}')"
          test "$actual" = "$CANDIDATE_SHA256"
          echo "published $RELEASE_TAG asset sha256 $actual equals the certified candidate"

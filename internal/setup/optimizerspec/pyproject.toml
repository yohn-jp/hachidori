# Hachidori private optimizer environment (Runtime Spec, uv project).
#
# This is not a Python package. It declares the Python/ML environment of the
# System One optimizer: a bounded, separate environment that `hachidori variant
# optimize` materializes with Hachidori's pinned private uv, so that the
# optimizer-only compression stack never enters the serving runtime. It is
# materialized like the serving runtime:
#
#   uv sync --locked --no-build --no-install-project --extra <cpu|cu128>
#
# uv.lock next to this file is the locked environment. Both files are embedded
# in the hachidori executable and are part of the optimizer runtime identity.
# After editing this file, regenerate the lock with the pinned uv version
# (internal/setup/spec.go) and commit both files:
#
#   uv lock --directory internal/setup/optimizerspec
[project]
name = "hachidori-optimizer"
version = "1"
requires-python = "==3.12.11"
dependencies = [
  "llmcompressor==0.14.0",
  "compressed-tensors==0.19.0",
  "transformers==5.17.0",
  "accelerate==1.15.0",
  "tokenizers==0.23.2",
  "safetensors==0.8.0",
  "numpy==2.5.3",
]

# PyTorch device flavors. Exactly one is selected per runtime.
[project.optional-dependencies]
cpu = ["torch==2.11.0+cpu"]
cu128 = ["torch==2.11.0+cu128"]

[tool.uv]
package = false
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
